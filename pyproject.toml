[project]
name = "tutorial-genesys"
version = "0.1.0"
description = "Agentic AI that generates publication-ready tutorials from trending AI topics for ai-evolution.com.au"
readme = "TUTORIAL-GENESYS.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "nanoSYNAPSYS" }]

dependencies = [
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "pygments>=2.18.0",
    "mistune>=3.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
genesys = "tutorial_genesys.cli:app"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
